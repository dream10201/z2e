x-common: &common
  image: ghcr.io/dream10201/z2e:latest
  build:
    context: .
  # 把 iGPU 映射进来
  devices:
    - /dev/dri:/dev/dri
  # 容器以 root 跑时不需要这个（root 有 CAP_DAC_OVERRIDE）；
  # 换成非 root 用户、且宿主机 renderD128 是 0660 时才必需。
  # RENDER_GID 取宿主机 `stat -c %g /dev/dri/renderD128`
  group_add:
    - "${RENDER_GID:-0}"
  volumes:
    - ./models:/models
  environment:
    - OV_CACHE=/models/.ovcache
    - HF_HOME=/models/.hf
    - MODELS_ROOT=/models
    - OV_DEVICE=${OV_DEVICE:-GPU}
    # 换模型改这个就行；目录名自动派生（Qwen/Qwen3-8B -> Qwen3-8B-int4-ov）
    - MODEL_ID=${MODEL_ID:-tencent/Hy-MT2-7B}
    - WEIGHT_FORMAT=${WEIGHT_FORMAT:-int4}
    # 国内下载慢可以设 HF_ENDPOINT=https://hf-mirror.com
    - HF_ENDPOINT=${HF_ENDPOINT:-}
    # 只在时段内驻留模型（本地时间，如 09:00-18:00，支持跨零点），
    # 时段外卸载把内存还给宿主机；空 = 全天服务
    - SERVE_HOURS=${SERVE_HOURS:-}
  shm_size: "2gb"

services:
  # OpenAI 兼容 HTTP API，OpenAPI 文档在 /docs
  # 模型不在会先自动导出，导完自动接着启动
  api:
    <<: *common
    container_name: z2e-api
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import json,urllib.request,sys; s=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['status']; sys.exit(0 if s in ('ok','sleeping') else 1)"]
      interval: 30s
      timeout: 10s
      # 首次要下模型 + 编译 GPU kernel，别让健康检查提前判死
      start_period: 3600s
      retries: 3
