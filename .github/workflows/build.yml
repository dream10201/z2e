name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成 tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          flavor: latest=false
          # runtime / export 是早前拆分留下的别名，指向同一个镜像，
          # 免得已经在用那两条命令的人被打断
          tags: |
            type=raw,value=latest
            type=raw,value=runtime
            type=raw,value=export
            type=ref,event=tag
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试
        run: |
          IMG=$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -1)
          # 绕过 entrypoint 的模型检查：runner 上没有模型，也不该在这儿下 15GB
          docker run --rm -v "$PWD/ci:/ci:ro" --entrypoint bash "$IMG" /ci/smoke.sh

      - name: entrypoint 在模型缺失时的行为
        run: |
          IMG=$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -1)
          # AUTO_EXPORT=0 时应该拒绝启动并说清楚原因（而不是抛 traceback，
          # 也不是在没人预期的时候闷头下 15GB）
          set +e
          out=$(docker run --rm -e AUTO_EXPORT=0 "$IMG" python -c "print('不该跑到这')" 2>&1)
          code=$?
          set -e
          echo "$out"
          test $code -ne 0 || { echo "模型缺失时应该退非零"; exit 1; }
          grep -q "找不到模型" <<<"$out" || { echo "没给出提示信息"; exit 1; }
