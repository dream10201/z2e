name: build-images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [runtime, export]

    steps:
      - uses: actions/checkout@v5

      - name: 腾出磁盘空间
        if: matrix.target == 'export'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成 tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # runtime -> :runtime / :latest；export -> :export
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.target }}
            type=raw,value=latest,enable=${{ matrix.target == 'runtime' }}
            type=ref,event=tag,suffix=-${{ matrix.target }}
            type=sha,format=short,suffix=-${{ matrix.target }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: 冒烟测试
        run: |
          IMG=$(echo '${{ steps.meta.outputs.tags }}' | head -1)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            :
          else
            docker pull "$IMG"
          fi
          # runner 上没有 iGPU，只能验证驱动装齐 + OpenVINO 能起来
          docker run --rm "$IMG" python -c "
import openvino as ov
core = ov.Core()
print('OpenVINO', ov.__version__, 'devices:', core.available_devices)
assert 'CPU' in core.available_devices
import openvino_genai
print('genai ok')
"
          docker run --rm --entrypoint bash "$IMG" -c \
            'ls -1 /usr/lib/x86_64-linux-gnu/ | grep -E "libze_intel_gpu|libigdrcl|libigdgmm" && ls /etc/OpenCL/vendors/'
